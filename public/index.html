<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    .auth { margin: 26px 0; padding: 18px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .auth label { display: block; margin-bottom: 10px; font-size: 14px; color: #bfd0e5; }
    .auth input { display: block; width: 100%; margin-top: 4px; padding: 10px 12px; border-radius: 8px;
      border: 1px solid #51667c; background: #101a28; color: #ecf4ff; font-size: 15px; box-sizing: border-box; }
    .auth button { padding: 10px 18px; border-radius: 8px; border: none; background: #8ad8df; color: #101a28;
      font-weight: 700; cursor: pointer; }
    #login-form button[type="submit"] { display: block; margin-left: auto; }
    .auth-error { color: #ffb3bd; margin: 10px 0 0; font-size: 14px; }
    .auth-error:empty { display: none; }
    #session-info:not([hidden]) { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    #session-info p { margin: 0; }
    #session-info strong { display: inline; color: #8ad8df; }
    .my-notes { margin: 26px 0; }
    .my-notes h2 { font-size: 20px; margin: 0 0 14px; }
    .my-notes label { display: block; margin-bottom: 10px; font-size: 14px; color: #bfd0e5; }
    .my-notes input, .my-notes textarea { display: block; width: 100%; margin-top: 4px; padding: 10px 12px;
      border-radius: 8px; border: 1px solid #51667c; background: #101a28; color: #ecf4ff; font-size: 15px;
      font-family: inherit; box-sizing: border-box; }
    .my-notes textarea { min-height: 70px; resize: vertical; }
    .my-notes > form > button[type="submit"] { display: block; margin-left: auto; }
    #my-notes-list li { display: grid; gap: 10px; }
    #my-notes-list .note-actions { display: flex; gap: 8px; justify-content: flex-end; }
    #my-notes-list .note-actions button { padding: 6px 14px; border-radius: 8px; border: 1px solid #51667c;
      background: transparent; color: #ecf4ff; cursor: pointer; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 4단계 로그인해도 내 자료만</div>
    <h1>점령된 자료실</h1>
    <p>지금은 보호 장치가 없는 상태입니다. 아래 기록은 모두 실습을 위해 만든 가상 자료입니다.</p>
    <div class="notice">이제 로그인해야 자료를 볼 수 있습니다. 다만 아직 소유자별 접근 제한은 없어 로그인한 계정이면 누구나 같은 자료를 봅니다(다음 단계 과제).</div>

    <div class="auth" id="auth">
      <form id="login-form">
        <label>이메일
          <input type="email" id="login-email" required autocomplete="email">
        </label>
        <label>비밀번호
          <input type="password" id="login-password" required autocomplete="current-password">
        </label>
        <button type="submit">로그인</button>
        <p class="auth-error" id="login-error" role="alert"></p>
      </form>
      <div id="session-info" hidden>
        <p>로그인됨: <strong id="session-email"></strong></p>
        <button type="button" id="logout-button">로그아웃</button>
      </div>
    </div>

    <ul id="notes" aria-live="polite"><li>가상 자료를 불러오는 중입니다.</li></ul>

    <div class="my-notes" id="my-notes" hidden>
      <h2>내 메모</h2>
      <form id="create-note-form">
        <label>제목
          <input type="text" id="new-note-title" required>
        </label>
        <label>내용
          <textarea id="new-note-body" required></textarea>
        </label>
        <button type="submit">메모 추가</button>
        <p class="auth-error" id="create-note-error" role="alert"></p>
      </form>
      <ul id="my-notes-list" aria-live="polite"></ul>
    </div>
  </main>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    // Project URL과 publishable key는 공개용 값이라 화면 코드에 넣어도 됩니다(서버 전용 키 아님).
    const supabase = createClient(
      'https://iyxvvnrekxthoixcdlht.supabase.co',
      'sb_publishable_T6veZAYIlx2HYpfPOTJ50g_yXVERRoW',
    );

    const loginForm = document.querySelector('#login-form');
    const loginError = document.querySelector('#login-error');
    const sessionInfo = document.querySelector('#session-info');
    const sessionEmail = document.querySelector('#session-email');
    const logoutButton = document.querySelector('#logout-button');
    const list = document.querySelector('#notes');

    async function loadNotes(session) {
      if (!session) {
        list.replaceChildren();
        return;
      }
      try {
        const response = await fetch('/api/notes', {
          cache: 'no-store',
          headers: { Authorization: `Bearer ${session.access_token}` },
        });
        if (!response.ok) throw new Error('자료를 읽을 수 없습니다.');
        const data = await response.json();
        if (!Array.isArray(data.notes)) throw new Error('자료 형식이 맞지 않습니다.');
        list.replaceChildren(...data.notes.map(note => {
          const item = document.createElement('li');
          const title = document.createElement('strong');
          const content = document.createElement('span');
          title.textContent = note.title;
          content.textContent = note.content;
          item.append(title, content);
          return item;
        }));
      } catch (error) {
        const item = document.createElement('li');
        item.textContent = error.message;
        list.replaceChildren(item);
      }
    }

    const myNotesSection = document.querySelector('#my-notes');
    const myNotesList = document.querySelector('#my-notes-list');
    const createNoteForm = document.querySelector('#create-note-form');
    const createNoteError = document.querySelector('#create-note-error');

    function renderSession(session) {
      loginError.textContent = '';
      if (session) {
        loginForm.hidden = true;
        sessionInfo.hidden = false;
        sessionEmail.textContent = session.user.email ?? '';
        myNotesSection.hidden = false;
      } else {
        loginForm.hidden = false;
        sessionInfo.hidden = true;
        loginForm.reset();
        myNotesSection.hidden = true;
      }
    }

    function renderMyNote(note, session) {
      const item = document.createElement('li');
      const titleEl = document.createElement('strong');
      const bodyEl = document.createElement('span');
      titleEl.textContent = note.title;
      bodyEl.textContent = note.body;

      const editButton = document.createElement('button');
      editButton.type = 'button';
      editButton.textContent = '수정';
      const deleteButton = document.createElement('button');
      deleteButton.type = 'button';
      deleteButton.textContent = '삭제';
      const actions = document.createElement('div');
      actions.className = 'note-actions';
      actions.append(editButton, deleteButton);
      item.append(titleEl, bodyEl, actions);

      editButton.addEventListener('click', () => {
        const titleInput = document.createElement('input');
        titleInput.type = 'text';
        titleInput.value = note.title;
        const bodyInput = document.createElement('textarea');
        bodyInput.value = note.body;
        const saveButton = document.createElement('button');
        saveButton.type = 'button';
        saveButton.textContent = '저장';
        const cancelButton = document.createElement('button');
        cancelButton.type = 'button';
        cancelButton.textContent = '취소';
        const editActions = document.createElement('div');
        editActions.className = 'note-actions';
        editActions.append(saveButton, cancelButton);
        item.replaceChildren(titleInput, bodyInput, editActions);

        cancelButton.addEventListener('click', () => loadMyNotes(session));
        saveButton.addEventListener('click', async () => {
          const response = await fetch(`/api/my-notes/${note.id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
            body: JSON.stringify({ title: titleInput.value, body: bodyInput.value }),
          });
          if (!response.ok) {
            alert('메모 수정에 실패했습니다.');
            return;
          }
          await loadMyNotes(session);
        });
      });

      deleteButton.addEventListener('click', async () => {
        const response = await fetch(`/api/my-notes/${note.id}`, {
          method: 'DELETE',
          headers: { Authorization: `Bearer ${session.access_token}` },
        });
        if (!response.ok && response.status !== 404) {
          alert('메모 삭제에 실패했습니다.');
          return;
        }
        await loadMyNotes(session);
      });

      return item;
    }

    async function loadMyNotes(session) {
      if (!session) {
        myNotesList.replaceChildren();
        return;
      }
      try {
        const response = await fetch('/api/my-notes', {
          cache: 'no-store',
          headers: { Authorization: `Bearer ${session.access_token}` },
        });
        if (!response.ok) throw new Error('내 메모를 읽을 수 없습니다.');
        const data = await response.json();
        if (!Array.isArray(data.notes)) throw new Error('자료 형식이 맞지 않습니다.');
        myNotesList.replaceChildren(...data.notes.map(note => renderMyNote(note, session)));
      } catch (error) {
        const item = document.createElement('li');
        item.textContent = error.message;
        myNotesList.replaceChildren(item);
      }
    }

    createNoteForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      createNoteError.textContent = '';
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) return;
      const titleInput = document.querySelector('#new-note-title');
      const bodyInput = document.querySelector('#new-note-body');
      const response = await fetch('/api/my-notes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
        body: JSON.stringify({ title: titleInput.value, body: bodyInput.value }),
      });
      if (!response.ok) {
        createNoteError.textContent = '메모를 추가하지 못했습니다.';
        return;
      }
      createNoteForm.reset();
      await loadMyNotes(session);
    });

    function loginErrorMessage(error) {
      const message = error?.message ?? '';
      if (/invalid login credentials/i.test(message)) return '이메일 또는 비밀번호가 올바르지 않습니다.';
      if (/email not confirmed/i.test(message)) return '이메일 인증이 완료되지 않았습니다.';
      if (/too many requests|rate limit/i.test(message)) return '요청이 너무 많습니다. 잠시 후 다시 시도해 주세요.';
      if (/network|fetch/i.test(message)) return '네트워크 오류로 로그인할 수 없습니다. 다시 시도해 주세요.';
      return '로그인에 실패했습니다. 다시 시도해 주세요.';
    }

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      loginError.textContent = '';
      const email = document.querySelector('#login-email').value;
      const password = document.querySelector('#login-password').value;
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) loginError.textContent = loginErrorMessage(error);
    });

    logoutButton.addEventListener('click', async () => {
      await supabase.auth.signOut();
    });

    supabase.auth.onAuthStateChange((_event, session) => {
      renderSession(session);
      loadNotes(session);
      loadMyNotes(session);
    });
    const { data: { session: initialSession } } = await supabase.auth.getSession();
    renderSession(initialSession);
    await loadNotes(initialSession);
    await loadMyNotes(initialSession);
  </script>
</body>
</html>
